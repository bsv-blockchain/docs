openapi: 3.0.3
info:
  title: Acme API
  version: 1.0.0
  description: Example spec. Replace it with your own; one page is generated per operation.
servers:
  - url: https://sandbox.api.example.com/v1
    description: Sandbox
  - url: https://api.example.com/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Orders
    description: Create and manage orders.
paths:
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      operationId: listOrders
      parameters:
        - name: limit
          in: query
          description: Maximum number of orders to return.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          description: Only return orders with this status.
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Orders]
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: integer
                  description: Amount in the smallest currency unit.
                  example: 2500
                currency:
                  type: string
                  description: Three-letter ISO 4217 code.
                  example: USD
      responses:
        '201':
          description: The created order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          description: The order ID.
          schema: { type: string, example: ord_123 }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No order with this ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    OrderStatus:
      type: string
      enum: [pending, paid, canceled]
    Order:
      type: object
      properties:
        id: { type: string, example: ord_123 }
        amount: { type: integer, example: 2500 }
        currency: { type: string, example: USD }
        status: { $ref: '#/components/schemas/OrderStatus' }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: not_found }
            message: { type: string, example: Order not found. }
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
