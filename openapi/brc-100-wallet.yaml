      summary: getNetwork
      description: Retrieves the Bitcoin network the wallet is using.
      tags:
      - Chain and wallet info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                originator:
                  $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - network
                properties:
                  network:
                    $ref: '#/components/schemas/WalletNetwork'
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /getVersion:
    post:
      operationId: getVersion
      summary: getVersion
      description: Retrieves the current version string of the wallet.
      tags:
      - Chain and wallet info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                originator:
                  $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - version
                properties:
                  version:
                    $ref: '#/components/schemas/VersionString7To30Bytes'
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /getPublicKey:
    post:
      operationId: getPublicKey
      summary: getPublicKey
      description: Retrieves a derived or identity public key based on the requested protocol, key ID, and counterparty.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identityKey:
                  type: boolean
                  const: true
                  description: If true, return the user's own identity key, ignoring protocolID/keyID/counterparty.
                protocolID:
                  $ref: '#/components/schemas/WalletProtocol'
                keyID:
                  $ref: '#/components/schemas/KeyIDStringUnder800Bytes'
                counterparty:
                  $ref: '#/components/schemas/WalletCounterparty'
                privileged:
                  type: boolean
                  default: false
                privilegedReason:
                  $ref: '#/components/schemas/DescriptionString5to50Bytes'
                seekPermission:
                  type: boolean
                  default: true
                forSelf:
                  type: boolean
                  default: false
                originator:
                  $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - publicKey
                properties:
                  publicKey:
                    $ref: '#/components/schemas/PubKeyHex'
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /revealCounterpartyKeyLinkage:
    post:
      operationId: revealCounterpartyKeyLinkage
      summary: revealCounterpartyKeyLinkage
      description: Reveals the key linkage between this wallet and a counterparty, across all interactions, to a verifier.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - counterparty
              - verifier
              properties:
                counterparty:
                  $ref: '#/components/schemas/PubKeyHex'
                verifier:
                  $ref: '#/components/schemas/PubKeyHex'
                privileged:
                  type: boolean
                  default: false
                privilegedReason:
                  $ref: '#/components/schemas/DescriptionString5to50Bytes'
                originator:
                  $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/KeyLinkageResult'
                - type: object
                  required:
                  - revelationTime
                  properties:
                    revelationTime:
                      $ref: '#/components/schemas/ISOTimestampString'
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /revealSpecificKeyLinkage:
    post:
      operationId: revealSpecificKeyLinkage
      summary: revealSpecificKeyLinkage
      description: Reveals the key linkage between this wallet and a counterparty for a specific protocol/keyID interaction.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - counterparty
              - verifier
              - protocolID
              - keyID
              properties:
                counterparty:
                  $ref: '#/components/schemas/WalletCounterparty'
                verifier:
                  $ref: '#/components/schemas/PubKeyHex'
                protocolID:
                  $ref: '#/components/schemas/WalletProtocol'
                keyID:
                  $ref: '#/components/schemas/KeyIDStringUnder800Bytes'
                privilegedReason:
                  $ref: '#/components/schemas/DescriptionString5to50Bytes'
                privileged:
                  type: boolean
                  default: false
                originator:
                  $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/KeyLinkageResult'
                - type: object
                  required:
                  - protocolID
                  - keyID
                  - proofType
                  properties:
                    protocolID:
                      $ref: '#/components/schemas/WalletProtocol'
                    keyID:
                      $ref: '#/components/schemas/KeyIDStringUnder800Bytes'
                    proofType:
                      type: integer
                      minimum: 0
                      maximum: 255
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /encrypt:
    post:
      operationId: encrypt
      summary: encrypt
      description: Encrypts plaintext using keys derived from the specified protocol, key ID, and counterparty.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WalletEncryptionArgs'
              - type: object
                required:
                - plaintext
                properties:
                  plaintext:
                    $ref: '#/components/schemas/ByteArray'
                  originator:
                    $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - ciphertext
                properties:
                  ciphertext:
                    $ref: '#/components/schemas/ByteArray'
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /decrypt:
    post:
      operationId: decrypt
      summary: decrypt
      description: Decrypts ciphertext using keys derived from the specified protocol, key ID, and counterparty.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WalletEncryptionArgs'
              - type: object
                required:
                - ciphertext
                properties:
                  ciphertext:
                    $ref: '#/components/schemas/ByteArray'
                  originator:
                    $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - plaintext
                properties:
                  plaintext:
                    $ref: '#/components/schemas/ByteArray'
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /createHmac:
    post:
      operationId: createHmac
      summary: createHmac
      description: Creates an HMAC over data using a key derived from the specified protocol, key ID, and counterparty.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WalletEncryptionArgs'
              - type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ByteArray'
                  originator:
                    $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - hmac
                properties:
                  hmac:
                    $ref: '#/components/schemas/ByteArray'
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /verifyHmac:
    post:
      operationId: verifyHmac
      summary: verifyHmac
      description: Verifies an HMAC over data using a key derived from the specified protocol, key ID, and counterparty.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WalletEncryptionArgs'
              - type: object
                required:
                - data
                - hmac
                properties:
                  data:
                    $ref: '#/components/schemas/ByteArray'
                  hmac:
                    $ref: '#/components/schemas/ByteArray'
                  originator:
                    $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - valid
                properties:
                  valid:
                    type: boolean
                    const: true
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /createSignature:
    post:
      operationId: createSignature
      summary: createSignature
      description: Creates a DER-encoded ECDSA signature over data or a precomputed hash using a derived key.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WalletEncryptionArgs'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ByteArray'
                    description: Data to be signed. Provide this or hashToDirectlySign, not both.
                  hashToDirectlySign:
                    $ref: '#/components/schemas/ByteArray'
                    description: Pre-hashed value to sign directly when data cannot be revealed.
                  originator:
                    $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - signature
                properties:
                  signature:
                    $ref: '#/components/schemas/ByteArray'
                    description: DER-encoded ECDSA signature bytes.
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
  /verifySignature:
    post:
      operationId: verifySignature
      summary: verifySignature
      description: Verifies a DER-encoded ECDSA signature over data or a precomputed hash using a derived key.
      tags:
      - Keys and cryptography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WalletEncryptionArgs'
              - type: object
                required:
                - signature
                properties:
                  data:
                    $ref: '#/components/schemas/ByteArray'
                  hashToDirectlyVerify:
                    $ref: '#/components/schemas/ByteArray'
                  signature:
                    $ref: '#/components/schemas/ByteArray'
                    description: DER-encoded ECDSA signature to validate.
                  forSelf:
                    type: boolean
                    default: false
                  originator:
                    $ref: '#/components/schemas/OriginatorDomainNameStringUnder250Bytes'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - valid
                properties:
                  valid:
                    type: boolean
                    const: true
        '400':
          description: Wallet error (BRC-100 error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletErrorObject'
components:
  schemas:
    HexString:
      type: string
      pattern: ^[0-9a-fA-F]*$
      description: A string containing only hexadecimal characters (0-9, a-f).
    TXIDHexString:
      $ref: '#/components/schemas/HexString'
      minLength: 64
      maxLength: 64
      description: Represents a transaction ID — exactly 64 hex characters.
    PubKeyHex:
      $ref: '#/components/schemas/HexString'
      minLength: 66
      maxLength: 66
      description: Compressed DER secp256k1 public key — exactly 66 hex characters (33 bytes).
    OutpointString:
      type: string
      pattern: ^[0-9a-fA-F]{64}\.[0-9]+$
      description: TXID (64 hex chars) followed by '.' and an output index integer.
    Base64String:
      type: string
      contentEncoding: base64
      description: Standard base64-encoded string.
    ByteArray:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 255
      description: Array of bytes (integers 0–255).
    SatoshiValue:
      type: integer
      minimum: 1
      maximum: 2100000000000000
      description: Value in satoshis. Max is 2.1 × 10^15 (total BSV supply).
    PositiveInteger:
      type: integer
      minimum: 1
      maximum: 4294967295
    PositiveIntegerOrZero:
      type: integer
      minimum: 0
      maximum: 4294967295
    PositiveIntegerDefault10Max10000:
      type: integer
      minimum: 1
      maximum: 10000
      default: 10
    PositiveIntegerMax10:
      type: integer
      minimum: 1
      maximum: 10
    DescriptionString5to50Bytes:
      type: string
      minLength: 5
      maxLength: 50
    BasketStringUnder300Bytes:
      type: string
      maxLength: 300
    OutputTagStringUnder300Bytes:
      type: string
      maxLength: 300
    LabelStringUnder300Bytes:
      type: string
      maxLength: 300
    ProtocolString5To400Bytes:
      type: string
      minLength: 5
      maxLength: 400
    KeyIDStringUnder800Bytes:
      type: string
      maxLength: 800
    CertificateFieldNameUnder50Bytes:
      type: string
      maxLength: 50
    OriginatorDomainNameStringUnder250Bytes:
      type: string
      maxLength: 250
      description: Fully qualified domain name (FQDN) of the requesting application.
    VersionString7To30Bytes:
      type: string
      minLength: 7
      maxLength: 30
      description: Version string in format [vendor]-[major].[minor].[patch].
    ISOTimestampString:
      type: string
      format: date-time
    WalletNetwork:
      type: string
      enum:
      - mainnet
      - testnet
    SecurityLevel:
      type: integer
      enum:
      - 0
      - 1
      - 2
      description: 0=Silent, 1=App, 2=Counterparty.
    WalletProtocol:
      type: array
      prefixItems:
      - $ref: '#/components/schemas/SecurityLevel'
      - $ref: '#/components/schemas/ProtocolString5To400Bytes'
      minItems: 2
      maxItems: 2
      description: '[securityLevel, protocolString] tuple.'
    WalletCounterparty:
      oneOf:
      - $ref: '#/components/schemas/PubKeyHex'
      - type: string
        enum:
        - self
        - anyone
    ActionStatus:
      type: string
      enum:
      - completed
      - unprocessed
      - sending
      - unproven
      - unsigned
      - nosend
      - nonfinal
      - failed
    AcquisitionProtocol:
      type: string
      enum:
      - direct
      - issuance
    KeyringRevealer:
      oneOf:
      - $ref: '#/components/schemas/PubKeyHex'
      - type: string
        const: certifier
    WalletEncryptionArgs:
      type: object
      required:
      - protocolID
      - keyID
      properties:
        protocolID:
          $ref: '#/components/schemas/WalletProtocol'
        keyID:
          $ref: '#/components/schemas/KeyIDStringUnder800Bytes'
        counterparty:
          $ref: '#/components/schemas/WalletCounterparty'
        privileged:
          type: boolean
          default: false
        privilegedReason:
          $ref: '#/components/schemas/DescriptionString5to50Bytes'
        seekPermission:
          type: boolean
          default: true
    WalletCertificate:
      type: object
      required:
      - type
      - subject
      - serialNumber
      - certifier
      - revocationOutpoint
      - signature
      - fields
      properties:
        type:
          $ref: '#/components/schemas/Base64String'
        subject:
          $ref: '#/components/schemas/PubKeyHex'
        serialNumber:
          $ref: '#/components/schemas/Base64String'
        certifier:
          $ref: '#/components/schemas/PubKeyHex'
        revocationOutpoint:
          $ref: '#/components/schemas/OutpointString'
        signature:
          $ref: '#/components/schemas/HexString'
        fields:
          type: object
          additionalProperties:
            type: string
          description: Map of CertificateFieldNameUnder50Bytes to string value.
    SendWithResult:
      type: object
      required:
      - txid
      - status
      properties:
        txid:
          $ref: '#/components/schemas/TXIDHexString'
        status:
          type: string
          enum:
          - unproven
          - sending
          - failed
    SignableTransaction:
      type: object
      required:
      - tx
      - reference
      properties:
        tx:
          $ref: '#/components/schemas/ByteArray'
          description: AtomicBEEF (BRC-95).
        reference:
          $ref: '#/components/schemas/Base64String'
    WalletActionInput:
      type: object
      required:
      - sourceOutpoint
      - sourceSatoshis
      - inputDescription
      - sequenceNumber
      properties:
        sourceOutpoint:
          $ref: '#/components/schemas/OutpointString'
        sourceSatoshis:
          $ref: '#/components/schemas/SatoshiValue'
        sourceLockingScript:
          $ref: '#/components/schemas/HexString'
        unlockingScript:
          $ref: '#/components/schemas/HexString'
        inputDescription:
          anyOf:
          - const: ''
          - $ref: '#/components/schemas/DescriptionString5to50Bytes'
          description: Stored history can omit display metadata using an empty string; new action request requirements are
            unchanged.
        sequenceNumber:
          $ref: '#/components/schemas/PositiveIntegerOrZero'
    WalletActionOutput:
      type: object
      required:
      - satoshis
      - spendable
      - tags
      - outputIndex
      - outputDescription
      - basket
      properties:
        satoshis:
          $ref: '#/components/schemas/SatoshiValue'
        lockingScript:
          $ref: '#/components/schemas/HexString'
        spendable:
          type: boolean
        customInstructions:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/OutputTagStringUnder300Bytes'
        outputIndex:
          $ref: '#/components/schemas/PositiveIntegerOrZero'
        outputDescription:
          anyOf:
          - const: ''
          - $ref: '#/components/schemas/DescriptionString5to50Bytes'
          description: Stored history can omit display metadata using an empty string; new action request requirements are
            unchanged.
        basket:
          $ref: '#/components/schemas/BasketStringUnder300Bytes'
    WalletOutput:
      type: object
      required:
      - satoshis
      - spendable
      - outpoint
      properties:
        satoshis:
          $ref: '#/components/schemas/SatoshiValue'
        lockingScript:
          $ref: '#/components/schemas/HexString'
        spendable:
          type: boolean
        customInstructions:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/OutputTagStringUnder300Bytes'
        outpoint:
          $ref: '#/components/schemas/OutpointString'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/LabelStringUnder300Bytes'
    WalletAction:
      type: object
      required:
      - txid
      - satoshis
      - status
      - isOutgoing
      - description
      - version
      - lockTime
      properties:
        txid:
          $ref: '#/components/schemas/TXIDHexString'
        satoshis:
          $ref: '#/components/schemas/SatoshiValue'
        status:
          $ref: '#/components/schemas/ActionStatus'
        isOutgoing:
          type: boolean
        description:
          anyOf:
          - const: ''
          - $ref: '#/components/schemas/DescriptionString5to50Bytes'
          description: Stored history can omit display metadata using an empty string; new action request requirements are
            unchanged.
        labels:
          type: array
          items:
            $ref: '#/components/schemas/LabelStringUnder300Bytes'
        version:
          $ref: '#/components/schemas/PositiveIntegerOrZero'
        lockTime:
          $ref: '#/components/schemas/PositiveIntegerOrZero'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/WalletActionInput'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/WalletActionOutput'
    KeyLinkageResult:
      type: object
      required:
      - encryptedLinkage
      - encryptedLinkageProof
      - prover
      - verifier
      - counterparty
      properties:
        encryptedLinkage:
          $ref: '#/components/schemas/ByteArray'
        encryptedLinkageProof:
          $ref: '#/components/schemas/ByteArray'
        prover:
          $ref: '#/components/schemas/PubKeyHex'
        verifier:
          $ref: '#/components/schemas/PubKeyHex'
        counterparty:
          $ref: '#/components/schemas/PubKeyHex'
    IdentityCertifier:
      type: object
      required:
      - name
      - iconUrl
      - description
      - trust
      properties:
        name:
          type: string
          maxLength: 100
        iconUrl:
          type: string
          maxLength: 500
        description:
          $ref: '#/components/schemas/DescriptionString5to50Bytes'
        trust:
          $ref: '#/components/schemas/PositiveIntegerMax10'
    IdentityCertificate:
      allOf:
      - $ref: '#/components/schemas/WalletCertificate'
      - type: object
        required:
        - certifierInfo
        - publiclyRevealedKeyring
        - decryptedFields
        properties:
          certifierInfo:
            $ref: '#/components/schemas/IdentityCertifier'
          publiclyRevealedKeyring:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/Base64String'
          decryptedFields:
            type: object
            additionalProperties:
              type: string
    CertificateResult:
      allOf:
      - $ref: '#/components/schemas/WalletCertificate'
      - type: object
        properties:
          keyring:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/Base64String'
          verifier:
            type: string
    WalletErrorObject:
      type: object
      required:
      - isError
      - message
      properties:
        isError:
          type: boolean
          const: true
        message:
          type: string
        code:
          type: string
          minLength: 10
          maxLength: 40
        stack:
          type: string
