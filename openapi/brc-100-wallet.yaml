                labels:
                  type: array
                  items:
                    $ref: '#/components/schemas/LabelStringUnder300Bytes'
                options:
                  type: object
                  properties:
                    signAndProcess:
                      type: boolean
                      default: true
                    acceptDelayedBroadcast:
