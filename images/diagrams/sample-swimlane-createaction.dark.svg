<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" fill="none" role="img" aria-labelledby="t">
<title id="t">Swimlane of a createAction call. The app calls createAction. The wallet checks the request. If it can finish alone, it returns the result. If not, it returns a signable transaction, the app signs and calls signAction, and the wallet returns the result.</title>
