<text x="372" y="195.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#a7afbd">the app must sign</text>
<rect x="272" y="268" width="200" height="60" rx="6" fill="#0f1218" stroke="#454d5c" stroke-width="1.25"/>
