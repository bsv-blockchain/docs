<text x="364" y="138" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9aa3b2">signableTransaction</text>
<path d="M472 68 L497 68 L497 170 L522 170" fill="none" stroke="#a7afbd" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr-a7afbd)"/>
<text x="505" y="138" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9aa3b2">signAction</text>
