<text x="615" y="138" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9aa3b2">result</text>
<rect x="22" y="38" width="170" height="60" rx="6" fill="#0f1218" stroke="#454d5c" stroke-width="1.25"/>
<text x="107" y="73" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e8ebf0">Call createAction</text>
