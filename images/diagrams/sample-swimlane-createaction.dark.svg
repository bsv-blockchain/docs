<text x="372" y="311.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#a7afbd">the wallet finishes alone</text>
<rect x="522" y="152" width="170" height="60" rx="6" fill="#0f1218" stroke="#454d5c" stroke-width="1.25"/>
<text x="607" y="178.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e8ebf0">Return the result</text>
<text x="607" y="195.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#a7afbd">txid and/or transaction</text>
