<svg xmlns="http://www.w3.org/2000/svg" width="720" height="564" viewBox="0 0 720 564" fill="none" role="img" aria-labelledby="t">
<title id="t">The BSV stack as four layers. The application layer (@bsv/simple/browser and @bsv/simple/server) sits above the BRC-100 wallet interface, which sits above the wallet toolkit (@bsv/wallet-toolbox), which sits on @bsv/sdk, the foundation.</title>
<defs><marker id="arr-a7afbd" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a7afbd"/></marker></defs>
